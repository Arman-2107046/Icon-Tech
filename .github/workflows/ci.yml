name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/icon_tech
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long
  CRON_SECRET: ci-cron-secret
  NEXT_PUBLIC_SITE_URL: http://localhost:3300
  NEXT_PUBLIC_STORE_CURRENCY: BDT

jobs:
  checks:
    name: Lint, unit tests, build, performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icon_tech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Client JS budget (product page, gzipped)
        run: |
          npm run start -- -p 3300 &
          npx wait-on http://localhost:3300/products/porter-tech-backpack --timeout 60000
          node scripts/check-bundle.mjs http://localhost:3300 /products/porter-tech-backpack 180
          kill %1
      - name: Lighthouse CI (LCP < 2.0s, CLS < 0.05, TBT < 200ms)
        run: npx lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icon_tech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
